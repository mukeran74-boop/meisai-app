<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPhoneの画面幅に合わせる。viewport-fit=cover で画面の端(ホームバー付近)まで使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ホーム画面に追加したとき、アプリのように全画面で開くための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="明細メモ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>明細メモ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <!-- ===== ホーム画面 ===== -->
    <section id="screen-home" class="screen is-active">
      <!-- 月の切り替え(ホームと取引で共通の月を使う) -->
      <div class="month-nav">
        <button type="button" class="month-prev" aria-label="前の月">‹</button>
        <span class="month-label"></span>
        <button type="button" class="month-next" aria-label="次の月">›</button>
      </div>

      <div class="summary">
        <p class="summary-label">この月の合計</p>
        <p class="summary-total" id="home-total">0円</p>
        <button type="button" class="badge-warning" id="home-unconfirmed" hidden></button>
      </div>

      <!-- 支払い元ごとのまとめ(タップでその支払い元の一覧へ) -->
      <div id="home-sources"></div>

      <!-- 読み込みの結果をここに表示する -->
      <p class="import-result" id="import-result" hidden></p>

      <!-- 明細を読み込むボタン。本物のファイル選択欄は隠し、ボタンから呼び出す -->
      <button type="button" class="primary-button" id="import-button">明細を読み込む</button>
      <input type="file" id="import-input" accept=".csv,text/csv" multiple hidden>
      <p class="hint">楽天カード・PayPayのCSVに対応しています。複数のファイルをまとめて選べます。</p>
    </section>

    <!-- ===== 取引一覧画面 ===== -->
    <section id="screen-list" class="screen">
      <div class="month-nav">
        <button type="button" class="month-prev" aria-label="前の月">‹</button>
        <span class="month-label"></span>
        <button type="button" class="month-next" aria-label="次の月">›</button>
      </div>

      <!-- 支払い元の切り替え -->
      <div class="segmented" id="source-filter">
        <button type="button" data-source="all" class="is-selected">すべて</button>
        <button type="button" data-source="rakuten">楽天カード</button>
        <button type="button" data-source="paypay">PayPay</button>
      </div>

      <div class="list-toolbar">
        <p class="list-total" id="list-total"></p>
        <!-- 押すたびに「未確認だけ」と「すべて」を切り替える -->
        <button type="button" class="filter-chip" id="unconfirmed-filter">未確認だけ表示</button>
      </div>
      <ul class="tx-list" id="tx-list"></ul>
    </section>

    <!-- ===== 取引の詳細画面(一覧の取引をタップすると開く) ===== -->
    <section id="screen-detail" class="screen">
      <button type="button" class="back-button" id="detail-back">‹ 戻る</button>

      <!-- 写真(なければ仮のアイコン) -->
      <div class="detail-photo" id="detail-photo"></div>

      <div class="detail-head">
        <p class="detail-name" id="detail-name"></p>
        <p class="detail-raw" id="detail-raw"></p>
        <p class="detail-amount" id="detail-amount"></p>
      </div>

      <!-- 日時・支払い元・支払い方法 -->
      <dl class="detail-info" id="detail-info"></dl>

      <!-- 確認の状態 -->
      <div class="detail-status">
        <span class="status-label" id="detail-status"></span>
        <button type="button" class="secondary-button" id="detail-confirm"></button>
      </div>

      <p class="section-label">写真</p>
      <div class="button-row">
        <button type="button" class="secondary-button" id="photo-pick">写真を選ぶ</button>
        <button type="button" class="secondary-button" id="photo-camera">カメラで撮る</button>
      </div>
      <button type="button" class="text-danger-button" id="photo-delete" hidden>写真を削除</button>
      <!-- 本物の選択欄は隠し、上のボタンから呼び出す -->
      <input type="file" id="photo-input" accept="image/*" hidden>
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>

      <p class="section-label">メモ</p>
      <textarea class="memo" id="detail-memo" rows="3" placeholder="通勤用のイヤホン"></textarea>
      <button type="button" class="primary-button" id="memo-save">メモを保存</button>

      <p class="detail-message" id="detail-message" hidden></p>
    </section>

    <!-- ===== グラフ画面 ===== -->
    <section id="screen-graph" class="screen">
      <header class="screen-header">
        <h1>グラフ</h1>
      </header>
      <div class="empty">
        <p class="empty-text">月ごとのグラフはこれから作ります。</p>
      </div>
    </section>

    <!-- ===== 設定画面 ===== -->
    <section id="screen-settings" class="screen">
      <header class="screen-header">
        <h1>設定</h1>
      </header>

      <p class="section-label">画面のモード</p>
      <div class="segmented" id="theme-switch">
        <button type="button" data-theme="auto">自動</button>
        <button type="button" data-theme="light">ライト</button>
        <button type="button" data-theme="dark">ダーク</button>
      </div>

      <p class="section-label">データ</p>
      <button type="button" class="danger-button" id="clear-button">すべてのデータを削除</button>

      <p class="note">データはこのiPhoneの中だけに保存しています。</p>
    </section>
  </main>

  <!-- ===== 下のタブ ===== -->
  <nav class="tabbar">
    <!-- アイコンは線だけのSVGで描く(文字の記号だとiPhoneで絵文字になることがあるため) -->
    <button type="button" class="tab is-active" data-target="screen-home">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>ホーム
    </button>
    <button type="button" class="tab" data-target="screen-list">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>取引
      <span class="tab-badge" id="tab-badge" hidden></span>
    </button>
    <button type="button" class="tab" data-target="screen-graph">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M10 19V6M15 19v-9M20 19V4"/></svg>グラフ
    </button>
    <button type="button" class="tab" data-target="screen-settings">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定
    </button>
  </nav>

  <!-- 読み込む順番が大事:db.js と csv.js の関数を app.js で使う -->
  <script src="js/db.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/image.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
