<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPhoneの画面幅に合わせる。viewport-fit=cover で画面の端(ホームバー付近)まで使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ホーム画面に追加したとき、アプリのように全画面で開くための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="明細メモ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>明細メモ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== 画面(タブで切り替える4つの画面) ===== -->
  <main>
    <!-- ホーム画面 -->
    <section id="screen-home" class="screen is-active">
      <header class="screen-header">
        <h1>ホーム</h1>
      </header>
      <div class="empty">
        <p class="empty-title">明細を読み込みましょう</p>
        <p class="empty-text">楽天カードやPayPayのCSVを読み込むと、ここに今月のまとめが表示されます。</p>
      </div>
    </section>

    <!-- 取引一覧画面 -->
    <section id="screen-list" class="screen">
      <header class="screen-header">
        <h1>取引</h1>
      </header>
      <div class="empty">
        <p class="empty-text">まだ取引がありません。</p>
      </div>
    </section>

    <!-- グラフ画面 -->
    <section id="screen-graph" class="screen">
      <header class="screen-header">
        <h1>グラフ</h1>
      </header>
      <div class="empty">
        <p class="empty-text">取引を読み込むと、月ごとのグラフが表示されます。</p>
      </div>
    </section>

    <!-- 設定画面 -->
    <section id="screen-settings" class="screen">
      <header class="screen-header">
        <h1>設定</h1>
      </header>

      <p class="section-label">画面のモード</p>
      <!-- 自動/ライト/ダークの切り替えボタン。data-theme の値をJavaScriptで読む -->
      <div class="segmented" id="theme-switch">
        <button type="button" data-theme="auto">自動</button>
        <button type="button" data-theme="light">ライト</button>
        <button type="button" data-theme="dark">ダーク</button>
      </div>

      <p class="note">データはこのiPhoneの中だけに保存しています。</p>
    </section>
  </main>

  <!-- ===== 下のタブ ===== -->
  <nav class="tabbar">
    <button type="button" class="tab is-active" data-target="screen-home">
      <span class="tab-icon" aria-hidden="true">⌂</span>ホーム
    </button>
    <button type="button" class="tab" data-target="screen-list">
      <span class="tab-icon" aria-hidden="true">≡</span>取引
    </button>
    <button type="button" class="tab" data-target="screen-graph">
      <span class="tab-icon" aria-hidden="true">▥</span>グラフ
    </button>
    <button type="button" class="tab" data-target="screen-settings">
      <span class="tab-icon" aria-hidden="true">⚙</span>設定
    </button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
